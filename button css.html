<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sub {
            background-color: rgb(229, 3, 52);
            color: white;
            height: 30px;
            border-width: 0px;
            transition: opacity 0.15s;
        }

        .sub:hover {
            cursor: pointer;
            opacity: 0.6;


        }

        .sub:active {
            opacity: 0.3;
        }

        .join {
            background-color: white;
            border-color: rgb(0, 115, 255);
            color: rgb(0, 110, 255);
            margin-left: 10px;
            transition: color 1s, background-color 1s;

        }

        .join:hover {
            transition: background-color 1s, color 1s;
            background-color: rgb(0, 81, 255);
            color: white;
            opacity: 0.7;




        }

        .join:active {
            opacity: 0.4;
        }

        .tweet {
            background-color: rgb(13, 208, 247);
            border-radius: 18px;
            padding-left:19px;
            padding-right:19px;
            padding-top:10px;
            padding-bottom:10px;
        
            margin-left:10px;
            margin-right:10px;
            color: white;
            border-width: 0px;
            transition: box-shadow 1s;



        }

        .tweet:hover {

            transition: opacity 0.15s, box-shadow 1s;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.15);

            opacity: 0.7;
        }

        .tweet:active {
            opacity: 0.3;
        }

        .add {
            height: 30px;
            width: 100px;
            background-color: rgb(255, 234, 0);
            border-radius: 18px;
            border: none;
            transition:background-color 0.15s;
            transition:opacity 1s;

        }

        .add:hover {
            background-color: rgb(237, 218, 1);
            transition:background-color 0.15s;
            
        }
        .add:active{
            opacity:0.3;

        }
        .shop-link{
               font-size:15px;
               font-style:Arial;
        
               text-align:center;
               background-color:red;
               color:white;
               border:none;
               padding:10px;
        }
        .shop-link span:hover{
            text-decoration:underline;
            cursor:pointer;
            
        }
        .shop-link span:active{
            opacity:0.6;
            
        }
        .but:hover{
            cursor:pointer;
            opacity:0.7;
            
            
            
        }
        .but:active{
            opacity:0.4;
            
            animation-name:na;
            animation-duration:0.15s;
        }
        @keyframes na{
            from{
                box-shadow:0 0 0 red ;
                
            }
            to{
                box-shadow:2px 2px 10px rgb(2, 20, 2);
                
            }
        }
        
    </style>
</head>

<body>
    <button class="sub">SUBSCRIBE</button>
    <button class="join">JOIN</button>
    <button class="tweet">Tweet</button>
    <button class="add">Add to a cart</button>
    <br>
    <br>
    <button class="shop-link">Shop early for the best selection. <span>shop now <</span> </button>
    <h1 style="font-weight:20px;margin-bottom:5px;">HTML CSS Course</h1>
    <p style="color:rgb(158, 156, 156); margin-top:3px;">Beginner to pro </p>
    <p style="width:230px;font-weight:15px;">In this course,we'll learn the skills you need to become a developer</p>
    <button class="but" style="background-color:rgb(6, 197, 6);border:none;color:white;border-radius:5px;padding:6px;padding-left:13px;padding-right:13px;">Get Started </button>
</body>

</html>
